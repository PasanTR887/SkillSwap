<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SkillSwap - Browse Skills</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>

<body onload="SkillSwap.renderUserNav(); SkillSwap.loadSkills();">
<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="/">SkillSwap</a>

    <div class="d-flex align-items-center gap-2">
      <!-- user info + role badge + logout will appear here -->
      <div id="userNav"></div>
    </div>
  </div>
</nav>


<div class="container py-4">
  <div class="card p-3 shadow-sm mb-3">
    <div class="row g-2">
      <div class="col-md-8">
        <input id="search" class="form-control"
          placeholder="Search skills (e.g., Photoshop, tutoring, Java)..."
          oninput="SkillSwap.loadSkills()">
      </div>
      <div class="col-md-4">
        <select id="category" class="form-select" onchange="SkillSwap.loadSkills()">
          <option value="">All Categories</option>
          <option>Design</option>
          <option>Coding</option>
          <option>Tutoring</option>
          <option>Writing</option>
          <option>Other</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row g-3" id="skillsList"></div>
</div>

<!-- Request Modal -->
<div class="modal fade" id="requestModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Request this Skill</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="requestForm">
        <div class="modal-body">
          <input type="hidden" id="reqSkillId" />

          <div class="mb-3">
            <label class="form-label">Project Details</label>
            <textarea id="reqMessage" class="form-control" rows="4"
              placeholder="Describe what you need, deadline, requirements..."></textarea>
          </div>

          <div class="row g-2">
            <div class="col-md-6">
              <label class="form-label">Preferred Contact</label>
              <select id="reqContactMethod" class="form-select">
                <option value="WhatsApp">WhatsApp</option>
                <option value="Email">Email</option>
                <option value="Call">Call</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Contact Value</label>
              <input id="reqContactValue" class="form-control" placeholder="e.g., 07xxxxxxxx or email">
            </div>
          </div>

          <div id="reqErr" class="text-danger small mt-2" style="display:none;"></div>
          <div class="text-muted small mt-2">
            Tip: include deadline + budget + files needed.
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Send Request</button>
        </div>
      </form>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
