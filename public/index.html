<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SkillSwap - Browse Skills</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>

<body onload="SkillSwap.renderUserNav(); SkillSwap.loadSkills();">
<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="/">SkillSwap</a>

    <div class="d-flex align-items-center gap-2">
      <!-- user info + role badge + logout will appear here -->
      <div id="userNav"></div>
    </div>
  </div>
</nav>


<div class="container py-4">
  <div class="card p-3 shadow-sm mb-3">
    <div class="row g-2">
      <div class="col-md-8">
        <input id="search" class="form-control"
          placeholder="Search skills (e.g., Photoshop, tutoring, Java)..."
          oninput="SkillSwap.loadSkills()">
      </div>
      <div class="col-md-4">
        <select id="category" class="form-select" onchange="SkillSwap.loadSkills()">
          <option value="">All Categories</option>
          <option>Design</option>
          <option>Coding</option>
          <option>Tutoring</option>
          <option>Writing</option>
          <option>Other</option>
        </select>
      </div>
    </div>
  </div>

  <div class="row g-3" id="skillsList"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
