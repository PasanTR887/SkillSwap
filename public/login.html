<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SkillSwap - Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="/">SkillSwap</a>
    <a class="btn btn-light btn-sm" href="/register.html">Register</a>
  </div>
</nav>


<div class="container py-5" style="max-width: 520px;">
  <div class="card p-4 shadow-sm">
    <h4 class="mb-1">Login</h4>
    <p class="text-muted mb-4">Access your skills and requests.</p>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" required>
      </div>

      <div id="err" class="text-danger small mb-3" style="display:none;"></div>

      <button class="btn btn-primary w-100">Login</button>
      <a class="btn btn-outline-secondary w-100 mt-2" href="/register.html">Create new account</a>

      <button type="button" class="btn btn-light w-100 mt-2" id="logoutBtn">Clear Saved Login</button>
    </form>
  </div>
</div>

<script>
  const API = (p) => `${location.origin}${p}`;

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("skillswap_auth");
    alert("Cleared.");
  });

  const existing = localStorage.getItem("skillswap_auth");
  if (existing) location.href = "/";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.style.display = "none";

    try {
      const res = await fetch(API("/api/auth/login"), {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Login failed");

      localStorage.setItem("skillswap_auth", JSON.stringify(data)); // {token, user}
      location.href = "/";
    } catch (e2) {
      err.textContent = e2.message;
      err.style.display = "block";
    }
  });
</script>
</body>
</html>
