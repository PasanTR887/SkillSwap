<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SkillSwap - Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body onload="SkillSwap.renderUserNav(); SkillSwap.renderDashboardByRole(); SkillSwap.loadIncoming(); SkillSwap.loadOutgoing();">

<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="/">SkillSwap</a>

    <!-- Filled by app.js -->
    <div id="userNav"></div>
  </div>
</nav>

<div class="container py-4">
  <div class="row g-3">

    <div class="col-lg-12" id="incomingSection">
      <div class="card p-3 shadow-sm">
        <h5 class="mb-3">Incoming Requests (for my skills)</h5>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead>
              <tr><th>Skill</th><th>Requester</th><th>Message</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="incoming"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-12" id="outgoingSection">
      <div class="card p-3 shadow-sm">
        <h5 class="mb-3">Outgoing Requests (I requested)</h5>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead>
              <tr><th>Skill</th><th>Owner</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="outgoing"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>


<!-- Review Modal -->
<div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Leave a Review</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="reviewForm">
        <div class="modal-body">
          <input type="hidden" id="reviewRequestId" />

          <div class="mb-3">
            <label class="form-label">Rating</label>
            <select id="reviewRating" class="form-select" required>
              <option value="">Select rating...</option>
              <option value="5">5 - Excellent</option>
              <option value="4">4 - Good</option>
              <option value="3">3 - Okay</option>
              <option value="2">2 - Bad</option>
              <option value="1">1 - Very Bad</option>
            </select>
          </div>

          <div class="mb-2">
            <label class="form-label">Comment (optional)</label>
            <textarea id="reviewComment" class="form-control" rows="3" placeholder="Write your feedback..."></textarea>
          </div>

          <div id="reviewErr" class="text-danger small mt-2" style="display:none;"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Submit Review</button>
        </div>
      </form>
    </div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
