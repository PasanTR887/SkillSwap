<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SkillSwap - Post Skill</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body onload="SkillSwap.renderUserNav(); SkillSwap.guardSellerPage(); SkillSwap.loadMySkills();">

<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="/">SkillSwap</a>

    <!-- Filled by app.js -->
    <div id="userNav"></div>
  </div>
</nav>


<div class="container py-4">
  <div class="row g-3">
    <div class="col-lg-5">
      <div class="card p-3 shadow-sm">
        <h5 class="mb-3">Post a Skill</h5>
        <form onsubmit="SkillSwap.createSkill(event)">
          <div class="mb-2">
            <label class="form-label">Title</label>
            <input id="title" class="form-control" required placeholder="e.g., Logo design in Photoshop">
          </div>
          <div class="mb-2">
            <label class="form-label">Category</label>
            <select id="cat" class="form-select" required>
              <option>Design</option>
              <option>Coding</option>
              <option>Tutoring</option>
              <option>Writing</option>
              <option>Other</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Price Type</label>
            <select id="priceType" class="form-select" onchange="document.getElementById('priceBox').style.display=this.value==='Paid'?'block':'none'">
              <option>Free</option>
              <option>Paid</option>
            </select>
          </div>
          <div class="mb-2" id="priceBox" style="display:none;">
            <label class="form-label">Price (LKR)</label>
            <input id="price" type="number" class="form-control" min="0" placeholder="e.g., 500">
          </div>
          <div class="mb-2">
            <label class="form-label">Description</label>
            <textarea id="desc" class="form-control" rows="3" placeholder="What you offer, details..."></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Availability</label>
            <input id="avail" class="form-control" placeholder="e.g., Weekends / After 5PM">
          </div>
          <button class="btn btn-primary w-100">Post Skill</button>
        </form>
      </div>
    </div>

    <div class="col-lg-7">
      <div class="card p-3 shadow-sm">
        <h5 class="mb-3">My Skills</h5>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead><tr><th>Title</th><th>Category</th><th>Price</th><th></th></tr></thead>
            <tbody id="mySkills"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
