<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SkillSwap - Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet">
</head>
<body class="auth-page">
<nav class="navbar navbar-dark">
  <div class="container d-flex justify-content-between align-items-center">
    <a class="navbar-brand fw-bold" href="/">SkillSwap</a>
    <a class="btn btn-light btn-sm" href="/login.html">Login</a>
  </div>
</nav>


<div class="container py-5" style="max-width: 520px;">
  <div class="card p-4 shadow-sm">
    <h4 class="mb-1">Create Account</h4>
    <p class="text-muted mb-4">Register as a Client or Skill Provider.</p>

    <form id="regForm">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input id="name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="email" type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" required minlength="4">
      </div>

      <div class="mb-3">
        <label class="form-label">Register as</label>
        <select id="role" class="form-select" required>
          <option value="client">Client (Request services)</option>
          <option value="seller">Skill Provider (Post skills)</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Department</label>
        <input id="dept" class="form-control">
      </div>

      <div id="err" class="text-danger small mb-3" style="display:none;"></div>

      <button class="btn btn-primary w-100">Register</button>
      <a class="btn btn-outline-secondary w-100 mt-2" href="/login.html">Go to Login</a>
    </form>
  </div>
</div>

<script>
  const API = (p) => `${location.origin}${p}`;

  document.getElementById("regForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.style.display = "none";

    const body = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("password").value,
      role: document.getElementById("role").value,
      department: document.getElementById("dept").value.trim()
    };

    try {
      const res = await fetch(API("/api/auth/register"), {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Registration failed");

      alert("Registered! Now login.");
      location.href = "/login.html";
    } catch (e2) {
      err.textContent = e2.message;
      err.style.display = "block";
    }
  });
</script>
</body>
</html>
